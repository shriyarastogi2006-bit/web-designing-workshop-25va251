<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=2;
        let b=4;
        console.log("a=",a , "& b= ",b)
        console.log("a+b = " , a+b);
        console.log("a % b = ", a % b);
        console.log("a **b = ", a ** b);

        console.log("a=",a , "& b= ",b);
        a++;
        console.log("a= " , a);
        console.log("--b= ",--b);
        console.log("b= ",b);
    </script>
</body>
</html>
